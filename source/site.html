/* Contact refinements: clear actions, recognizable social logos and team cards. */
.contact-page button{font-family:inherit;cursor:pointer}

.contact-jumps{gap:12px;padding:25px 0 35px;border:0}

.contact-team-card p{font-size:14px;color:var(--muted);margin:10px 0 20px}
.contact-teams a span.contact-team-email{font-size:12px;color:var(--ink);margin:0}

/* Archive sections must not inherit the older oversized .history-year label style. */
.history-page{font-family:Arial,Helvetica,sans-serif;font-size:17px;letter-spacing:normal;word-spacing:normal;line-height:1.6}
.history-edition{font-family:inherit;font-size:17px;letter-spacing:normal;word-spacing:normal;line-height:1.6}
.history-years{display:block;overflow-x:auto;padding:4px 0 12px;margin:0;scrollbar-width:thin}
.history-years ol{display:flex;list-style:none;margin:0;padding:0;min-width:650px}
.history-years li{position:relative;flex:1;min-width:65px}
.history-years li:before{content:'';position:absolute;left:0;right:0;bottom:15px;height:2px;background:#b9d1d5}
.history-years li:first-child:before{left:50%}.history-years li:last-child:before{right:50%}
.history-years button{position:relative;display:flex;flex-direction:column;align-items:center;gap:17px;width:100%;min-height:73px;border:0;border-radius:0;padding:10px 8px 9px;background:transparent;font-size:16px;line-height:1.25}
.history-years button .history-timeline-label{color:var(--ink);font-weight:600}
.history-years button .history-timeline-dot{display:block;width:14px;height:14px;border:2px solid var(--turquoise);border-radius:50%;background:#fff;z-index:1}
.history-years button:hover{background:transparent;text-decoration:none}
.history-years button:hover .history-timeline-label,.history-years button:focus-visible .history-timeline-label{color:var(--turquoise)}
.history-years button:hover .history-timeline-dot,.history-years button:focus-visible .history-timeline-dot{background:var(--turquoise);box-shadow:0 0 0 4px #007e8a18}
.history-years button:focus-visible{outline-offset:-3px;border-radius:5px}
@media(max-width:760px){.history-years{padding-bottom:16px}.history-years ol{min-width:720px}.history-years button{font-size:15px}.history-edition{font-size:16px}}

/* Editorial archive: each content type has its own readable presentation. */
.history-materials{margin-top:38px;display:grid;gap:10px}
.history-materials>details.history-material-group{border:1px solid #d7e3e5;border-radius:8px;background:#fff;overflow:hidden}
.history-materials>details.history-material-group:last-child{border:1px solid #d7e3e5}
.history-materials>.history-material-group>summary{align-items:center;padding:22px 25px;gap:20px;min-height:74px;font-size:19px}
.history-group-number{font-size:12px;font-weight:600;color:var(--turquoise);letter-spacing:.06em;flex-shrink:0}
.history-group-title{flex:1;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.history-material-group[open]>summary{border-bottom:1px solid var(--line);background:#f6fafa}
.history-materials details>.history-material-content{padding:8px 30px 30px;color:var(--ink)}
.history-material-content .history-subheading{font-size:21px;line-height:1.35;font-weight:600;letter-spacing:-.025em;margin:30px 0 20px;color:var(--ink)}
.history-copy{max-width:850px;margin:22px 0;font-size:16px;line-height:1.8;color:var(--muted);letter-spacing:normal}
.history-copy strong{color:var(--ink);font-weight:600}
.history-copy em{color:inherit;font-style:normal;font-weight:inherit}
.history-media-grid{margin:28px 0;gap:24px}
.history-media-grid.history-media-person{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:34px 24px}
.history-person{margin:0;text-align:center;min-width:0}
.history-media-grid .history-person-photo{display:block;width:128px;height:128px;max-width:100%;aspect-ratio:1;margin:0 auto 15px;padding:0;border:0;border-radius:50%;overflow:hidden;background:#edf3f3}

.history-person figcaption{font-size:13px;line-height:1.6;color:var(--muted);overflow-wrap:anywhere}
.history-person figcaption strong{display:inline;font-size:15px;line-height:1.4;color:var(--ink);font-weight:600}
.history-media-grid.history-media-venue{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}
.history-venue{margin:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}

.history-venue figcaption>span{position:absolute;right:20px;top:20px;color:var(--turquoise)}
.history-venue figcaption p{margin:0 0 9px;font-size:14px;line-height:1.6}
.history-venue figcaption p:last-child{margin-bottom:0;color:var(--muted)}
.history-media-grid.history-media-brands{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:18px 0 30px}
.history-media-grid .history-brand{display:flex;flex:0 1 174px;align-items:center;justify-content:center;height:112px;min-width:140px;padding:20px;background:#fff;border:1px solid #e1e9eb;border-radius:6px}
.history-media-grid .history-brand img{display:block;width:100%;max-width:134px;height:72px;object-fit:contain}
.history-group-sponsors .history-copy{margin:28px 0 12px;font-size:14px;letter-spacing:.04em}
.history-media-grid .history-gallery-photo{padding:0;border:0;border-radius:6px;overflow:hidden;display:block}
.history-media-grid .history-gallery-photo img{display:block;width:100%;height:190px;object-fit:cover}
.history-group-gallery .history-media-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.history-group-agenda .history-copy{padding:18px 22px;border-left:2px solid #b4d3d6;background:#f7fafa;border-radius:0 5px 5px 0;margin:16px 0;max-width:none}
.history-group-agenda .history-media-person{grid-template-columns:repeat(4,minmax(0,1fr));padding:10px 0 15px}
.history-group-agenda .history-media-person .history-person-photo{width:110px;height:110px}

.history-document-heading{display:flex;align-items:center;gap:18px;padding:23px}

.history-document-heading>div{flex:1;min-width:0}
.history-document-heading strong{display:block;font-size:18px;letter-spacing:-.02em}

story/69079e07fbcb.jpeg", "alt": "Gastón Soria", "href": "", "name": "Gastón Soria"}]}, {"title": "Sedes", "type": "venues", "blocks": [{"kind": "text", "html": "En la edición 2024 de <em>Masters Argentina</em>, los eventos se llevaron a cabo en dos destacados espacios de Nueva York. El primer día, en el <em>Salón Bolívar</em> del <em>Council of the Americas</em>, un lugar clave para discusiones sobre América Latina. El segundo día, en el <em>Columbia Faculty House</em>, ubicado en el campus de la Universidad de Columbia, un entorno académico ideal para fomentar el intercambio de ideas y conexiones entre los participantes."}, {"kind": "venue", "src": "assets/history/1625760e27ac.jpg", "alt": "Imagen del archivo oficial", "href": "https://www.as-coa.org/about/680-park-ave", "caption": "Council of the Americas"}, {"kind": "venue", "src": "assets/history/76b624d378ad.jpg", "alt": "Imagen del archivo oficial", "href": "https://facultyhouse.columbia.edu/", "caption": "Columbia Faculty House"}]}, {"title": "Agenda", "type": "agenda", "blocks": [{"kind": "text", "html": "La conferencia <em>Masters Argentina 2024</em> se llevará a cabo durante dos días, comenzando el viernes 5 de abril en el <em>Council of the Americas</em> con un recorrido guiado por la muestra de arte y un cocktail de bienvenida. El sábado 6 de abril, en la <em>Columbia Faculty House</em>, los asistentes participarán en paneles de discusión sobre emprendimiento, innovación, y desarrollo económico, además de contar con momentos de networking, almuerzo, y un cocktail de cierre en el Consulado Argentino en Nueva York."}, {"kind": "embed", "src": "https://docs.google.com/presentation/d/e/2PACX-1vSvALNbtpwGdaKLdlY71l867vNtg5K4GUU585SHDWRhLk0OxTnGbUnqVIcEQL6Y6fQVjsBMjEttjIjL/embed?start=false&loop=false&delayms=60000"}]}, {"title": "Sponsors y apoyos", "type": "sponsors", "blocks": [{"kind": "text", "html": "<strong>Diamond Sponsors</strong>"}, {"kind": "image", "src": "assets/history/6ffe8bc31107.png", "alt": }, {"kind": "person", "src": "assets/history/55f3fc8c752b.jpeg", "alt": "Hernán Lacunza", "href": "https://www.linkedin.com/in/hern%C3%A1n-lacunza-b1585115/", "name": "Hernán Lacunza"}, {"kind": "person", "src": "assets/history/3c3fd700ef09.jpeg", "alt": "José Menéndez", "href": "https://www.linkedin.com/in/josemenendez1/", "name": "José Menéndez"}, {"kind": "person", "src": "assets/history/182a773ad482.jpeg", "alt": "Juan Fantoni", "href": "https://www.linkedin.com/in/juanfantoni/", "name": "Juan Fantoni"}, {"kind": "person", "src": "assets/history/521f3ee3afe8.jpeg", "alt": "Matías Peire", "href": "https://www.linkedin.com/in/matiaspeire?miniProfileUrn=urn%3Ali%3Afs_miniProfile%3AACoAAACYi64B8viKld0hu4RPyjGwNKKpDAJQn2Y&lipi=urn%3Ali%3Apage%3Ad_flagship3_search_srp_all%3B6y9oXOajSP2XqO6eUmX5dQ%3D%3D", "name": "Matías Peire"}, {"kind": "person", "src": "assets/history/4e3586fd137a.jpeg", "alt": "Santiago Caniggia Bengolea", "href": "https://www.linkedin.com/in/santiago-caniggia-bengolea-616a156/", "name": "Santiago Caniggia Bengolea"}]}, {"title": "Sedes", "type": "venues", "blocks": [{"kind": "venue", "src": "assets/history/27da2f137095.jpg", "alt": "Imagen del archivo oficial", "href": "https://cnyor.cancilleria.gob.ar/", "caption": "Consulado Argentino en NY"}, {"kind": "venue", "src": "assets/history/8ebe3ac09e9c.jpg", "alt": "Imagen del archivo oficial", "href": "https://business.columbia.edu/", "caption": "Columbia Business School"}, {"kind": "venue", "src": "assets/history/39c5388f6d3e.jpg", "alt": "Imagen del archivo oficial", "href": "https://www.facebook.com/people/Life-Rooftop-Central-Park/100071247558831/", "caption": "Life Rooftop"}]}, {"title": "Agenda", "type": "agenda", "blocks": [{"kind": "text", "html": "El sábado 15 de abril, en Columbia Business School, la jornada comienza con acreditación y desayuno, seguida de paneles sobre oportunidades en la industria del litio, innovación financiera y liderazgo político, culminando con un cocktail en Life Rooftop a las 8:30 PM.<br/>El domingo 16 de abril se exploraron los desafíos de la transición política, el capital de riesgo en biotecnología, y el impacto de la tecnología y la demografía en el futuro del trabajo. Estas sesiones brindaron una perspectiva integral sobre el desarrollo económico y social del país, cerrando con un almuerzo de despedida."}, {"kind": "embed", "src": "https://docs.google.com/presentation/d/e/2PACX-1vSpKppZr0e21ebUAqBXZFqic9KCewniBIvl4jweywckngnS_NZOnljWAP3Vqi2mmg/embed?start=false&loop=true&delayms=5000"}]}, {"title": "Sponsors y apoyos", "type": "sponsors", "blocks": [{"kind": "image", "src": "assets/history/2e36a3bd2c35.jpg", "alt": "Imagen del archivo oficial", "href": "assets/history/64608b51cb8b.jpg"}, {"kind": "image", "src": "assets/history/a4066f7d6aff.png", "alt": "Imagen del archivo oficial", "href": "assets/history/42ed3f412a55.png"}, {"kind": "image", "src": "assets/history/ebefe61a1fa5.png", "alt": "Imagen del archivo oficial", "href": "assets/history/9be1c77d9a82.png"}, {"kind": "image", "src": "assets/history/b504e7ac0a8e.png", "alt": "Imagen del archivo oficial", "href": "assets/history/6f3375540652.png"}, {"kind": "image", "src": "assets/history/cf52aeafef04.jpeg", "alt": "Imagen del archivo oficial", "href": "assets/history/7099640a63d1.jpeg"}]}]}, {"year": 2022, "city": "Chicago", "date": "8 al 10 de abril de 2022", "title": "Conversaciones improbables para una Argentina posible", "venue": "Chicago Booth · Northwestern Kellogg", "summary": "La propuesta fue acercar miradas del ámbito público, empresarial, social y deportivo para conversar sobre los acuerdos que necesita Argentina.", "source": "https://old.mastersargentina.org/conferencia-20221.html", "cover": "assets/history/e95629828178.jpg", "sections": [{"title": "Temario y speakers", "blocks": [{"kind": "heading", "text": "Conversaciones improbables para una Argentina posible"}, {"kind": "text", "html": "Charla TED: \"Tecnología, demografía y futuro del trabajo\"<br/>Speaker: Sergio Kaufman - Presidente de Accenture"}, {"kind": "text", "html": "\"Conversaciones sobre innovación\"<br/>Speakers:<br/>- Francisco Ortega - Managing partner LATAM, McKinsey &amp; Company<br/>- Federico Trucco - CEO, Bioceres<br/>- Germán Bassi - Co-founder, Technysis"}, {"kind": "text", "html": "Charla TED: \"YPF 100 Años\"<br/>Speaker: Sergio Affronti - CEO YPF"}, {"kind": "text", "html": "\"La agenda verde y la agroindustria: del desafío a la innovación\"<br/>Los productos de origen agropecuario, incluyendo materias primas como manufacturas, representan el 70% del total de las exportaciones argentinas. De este modo, el agro sigue siendo el principal motor del comercio exterior argentino. Sin embargo, los desafíos del cambio climático y un entorno global cada vez más volátil  nos obligan a repensar la producción agropecuaria para garantizar su sustentabilidad en el largo plazo. ¿Qué rol tiene la tecnología, la innovación y el talento argentino en ese contexto?<br/>Speakers:<br/>- Ignacio Lartirigoyen -  Presidente, Lartirigoyen<br/>- Enrique López Lecube - CFO, Bioceres<br/>- Federico Vartorelli - Global Head of Breeding Customer Insights, Bayer AG"}, {"kind": "text", "html": "\"Consensos improbables para la argentina que se viene\"<br/>La segunda década del siglo XXI encuentra a la Argentina sin una visión compartida de futuro y, por ende, diferencias muy marcadas en las políticas de largo plazo. Los consensos, tan necesarios, parecen cada vez más improbables. En ese contexto, la fuerza, perseverancia e innovación de los argentinos conviven hoy con un alto nivel de incertidumbre y preocupación. Algunos jóvenes, incluso, piensan en emigrar, en la búsqueda de estabilidad. ¿Cuáles son los temas en los que debemos alcanzar esos consensos improbables? ¿Cuál es la visión común que sí podemos construir? ¿Cómo invitamos a los jóvenes a que sean parte?<br/>Speakers:<br/>- Alfredo Cornejo - Diputado Nacional por la Provincia de Mendoza<br/>- Patricia Bullrich - Presidente de Pro y ex-Ministra de Seguridad de la Nación<br/>- José Luis Espert - Diputado Nacional por la Provincia de Buenos Aires"}, {"kind": "text", "html": "Charla TED: \"La misión Mars Sample Return - El próximo capítulo en la busca de vida en Marte\"<br/>Speaker: Miguel San Martín - Investigador en NASA"}, {"kind": "text", "html": "\"La capacidad de reinventarse: la versatilidad como característica argentina\"<br/>Abordar una trayectoria profesional en lugar de enfocarnos únicamente en nuestro empleo o situación  actual requiere de flexibilidad para adaptarnos y enfrentarnos a desafíos impensados. Este panel reúne a argentinos exitosos que se caracterizan por sus particulares  recorridos profesionales. En una conversación interdisciplinaria, conoceremos sobre sus experiencias y motivaciones que los convirtieron en los profesionales que son hoy.<br/>Speakers:<br/>- Luis Malvido - CEO, Sky Mexico<br/>- Paulina Cocina - Productora de contenidos<br/>- Emmanuel Ferrario - Vicepresidente, Legislatura CABA"}], "source": "https://old.mastersargentina.org/temario-y-speakers.html", "type": "agenda"}, {"title": "Sede y agenda", "blocks": [{"kind": "heading", "text": "SEDES Y AGENDA"}, {"kind": "text", "html": "CHICAGO, IL - 8, 9 y 10 de abril 2022"}, {"kind": "text", "html": "<a href=\"https://www.chicagobooth.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">• University of Chicago, Booth School of Business</a> - Chicago Booth Harper Center"}, {"kind": "text", "html": "<a href=\"https://www.kellogg.northwestern.edu/\" rel=\"noopener noreferrer\" target=\"_blank\">• Northwestern University, Kellogg School of Management</a> - Global Hub"}, {"kind": "text", "html": "Viernes 8 de abril: Offshore Rooftop &amp; Bar (Navy Pier)<br/>RECEPCIÓN DE BIENVENIDA - Networking &amp; Cocktail  <br/>7 PM | Offshore Rooftop &amp; Bar (Navy Pier)<br/><br/>Sábado 9 de abril: Global Hub- Kellogg School Northwestern University<br/><br/>CONFERENCIA 2022 \"Conversaciones improbables para una Argentina posible\"<br/>08:30 AM - 5:30PM | White Auditorium<br/><br/>08:30 - 09:15  Acreditación y desayuno<br/>09:15 - 09:30  Opening Remarks<br/><br/>09:30 - 10:15  “Tecnología, demografía y el futuro del trabajo” <br/>Keynote speaker: Sergio Kaufman - Presidente de Accenture<br/><br/>10:15 - 11:15   Conversaciones sobre Innovación<br/>Federico Trucco - CEO, Bioceres<br/>Francisco Ortega - Managing Partner LATAM, McKinsey<br/>Germán Bassi - Co-founder, Technysis<br/><br/>11:15 - 11: 30  Coffee Break<br/><br/>11:30 - 12:00  YPF 100 años<br/>Keynote speaker: Sergio Affronti - CEO, YPF<br/><br/>12:00 - 1:00    La agenda verde y la agroindustria: del desafío a la innovación<br/>Luis Colmegna -  Gerente General, Lartirigoyen<br/>Enrique Lopez Lecube - CFO, Bioceres<br/>Federico Vartorelli - Global Head of Breeding Customer Insights, Bayer AG<br/><br/>1:00 - 2:00 Almuerzo y networking - Toma de fotos (1:45 foto grupal)<br/><br/>2:00 - 3:00 Consensos improbables para la argentina que se viene<br/>Alfredo Cornejo -  Senador Nacional por la Provincia de Mendoza<br/>Patricia Bullrich - Presidente de Pro y ex-Ministra de Seguridad de la Nación<br/>Juan Luis Espert - Diputado Nacional por la provincia<br/><br/>3:00 - 3:40 Ted \"La Misión Mars Sample Return -El Próximo Capítulo en la Busca de<br/>Vida en Marte” Miguel San Martín - Jefe de Ingeniería, Guiado y Control del Jet Propulsion  Laboratory<br/><br/>3:40 - 4:00  Coffee Break<br/><br/>4:00 - 5:30 La capacidad de reinventarse: la versatilidad como característica argentina<br/>Luis Malvido - CEO, Sky Mexico<br/>Paulina Cocina - CEO, Paulina Cocina<br/>Emmanuel Ferrario- Vicepresidente primero, Legislatura CABA<br/><br/>CENA - UNION LEAGUE CLUB<br/>8:00 PM | 65 West Jackson Boulevard, Chicago, IL 60604<br/><br/>Domingo 10 de abril: The University of Chicago Booth School of Business<br/><br/>CICLO DE CONVERSACIONES - Meet &amp; Greets   <br/>09:45 AM - 3:00 PM   |  Chicago Booth Harper Center 5807 S Woodlawn Ave Chicag ", "venue": "Encuentro virtual", "summary": "Una edición a distancia dedicada a los consensos y a la adaptación frente a nuevos desafíos. Trabajo, salud, género y tecnología formaron parte de los debates.", "source": "https://old.mastersargentina.org/conferencia-2021.html", "cover": "assets/history/606706e9b6d2.png", "sections": [{"title": "Imágenes y videos de la edición", "blocks": [{"kind": "image", "src": "assets/history/606706e9b6d2.png", "alt": "Imagen del archivo oficial", "href": ""}], "type": "gallery"}, {"title": "Argentina resiliente: consensos del presente hacia el futuro", "blocks": [{"kind": "text", "html": "Argentina Resiliente: consensos del presente hacia el futuro<br/><br/>Este año nos encontramos organizando la conferencia virtual “Masters Argentina 2021: Argentina Resiliente”. Esta conferencia nos invita sentarnos a conversar sobre cómo adaptarnos ante los desafíos de la nueva década y cómo aprovechar nuestras fortalezas para alcanzar un desarrollo inclusivo en un contexto complejo. <br/><br/>Nuestras mesas debate tocaran temas tan importantes como el futuro del mercado de trabajo en Argentina, violencia de género y la respuesta del estado, los desafíos de nuestro sistema de Salud y cómo aplicar nuevas tecnologías para potenciar el crecimiento del país.<br/> <br/>Entendemos que la Argentina es nuestro proyecto en común y su desarrollo nuestro gran desafío. Como estudiantes y profesionales, este es el compromiso que nos impulsa a formarnos con responsabilidad y seriedad, con la mirada puesta en el mundo y el corazón en la Argentina.<br/><br/>¡Los esperamos!<br/>"}, {"kind": "image", "src": "assets/history/606706e9b6d2.png", "alt": "Imagen", "href": ""}], "source": "https://old.mastersargentina.org/argentina-resiliente-consensos-del-presente-hacia-el-futuro.html", "type": "story"}, {"title": "Agenda", "blocks": [{"kind": "image", "src": "assets/history/1b6b28607151.png", "alt": "Imagen", "href": ""}, {"kind": "image", "src": "assets/history/02320a10ff97.png", "alt": "Imagen", "href": ""}, {"kind": "image", "src": "assets/history/b42436650038.png", "alt": "Imagen", "href": ""}], "source": "https://old.mastersargentina.org/agenda.html", "type": "agenda"}, {"title": "Equipo", "blocks": [{"kind": "heading", "text": "EQUIPO"}, {"kind": "heading", "text": "COORDINACIÓN GENERAL"}, {"kind": "person", "src": "assets/history/39ee85ea2de7.jpg", "alt": "Imagen", "href": "", "name": "", "captionHtml": "<strong>Kemel Hallar</strong><br/>Purdue University - M.S. in Engineering Management ‘20"}, {"kind": "person", "src": "assets/history/0ad1a5c0b500.jpeg", "alt": "Imagen", "href": "", "name": "", "captionHtml": "<strong>Ariana Grossi</strong>"}, {"kind": "heading", "text": "SPONSORS"}, {"kind": "image", "src": "assets/history/5d748b53967e.jpg", "alt": "Imagen", "href": ""}, {"kind": "image", "src": "assets/history/ede898954b32.jpeg", "alt": "Imagen del archivo oficial", "href": ""}, {"kind": "person", "src": "assets/history/675073efbf59.jpeg", "alt": "Imagen del archivo oficial", "href": "", "name": "", "captionHtml": "<strong>Enrique Pelaez</strong>"}, {"kind": "text", "html": "<strong>Giuliana Daga</strong>"}, {"kind": "text", "html": "<strong>Josefina Vizcaíno</strong>"}, {"kind": "text", "html": "Binghamton University - M.S. in Geological <br/>Sciences ‘21"}, {"kind": "heading", "text": "CONTENIDOS"}, {"kind": "person", "src": "assets/history/da0205bf3b11.png", "alt": "Imagen", "href": "", "name": "", "captionHtml": "<strong>Mila Cantar</strong><br/>Cornell University - MPA ‘21"}, {"kind": "person", "src": "assets/history/111bcaf3b1a0.jpg", "alt": "Imagen", "href": "", "name": "", "captionHtml": "<strong>Iván Baumann Fonay</strong><br/>Columbia University - MPA in Economic Policy  Management '21"}, {"kind": "person", "src": "assets/history/bd05c3e0e6e5.jpg", "alt": "Imagen", "href": "", "name": "", "captionHtml": "<strong>Gabriela Commateo</strong><br/>King's College London - Master of Law in Intellectual Property and IT ntros virtuales", "date": "Junio y julio de 2020", "title": "Masters Argentina Conecta", "venue": "Ciclo solidario de cinco webinars", "summary": "La conferencia presencial prevista para Chicago se canceló por el COVID-19. En su lugar, el ciclo Conecta abrió conversaciones virtuales y acompañó la iniciativa solidaria #SeamosUno.", "source": "https://old.mastersargentina.org/conferencia-2020.html", "cover": "assets/history/71d8ae74b782.jpeg", "sections": [{"title": "Imágenes y videos de la edición", "blocks": [{"kind": "image", "src": "assets/history/71d8ae74b782.jpeg", "alt": "Imagen del archivo oficial", "href": ""}], "type": "gallery"}, {"title": "Sponsors", "blocks": [{"kind": "image", "src": "assets/history/a0d008654da4.png", "alt": "Imagen", "href": ""}], "source": "https://old.mastersargentina.org/sponsors.html", "type": "sponsors"}, {"title": "Master argentina conecta", "blocks": [{"kind": "heading", "text": "PRESENTAMOS UNA NUEVA INICIATIVA"}, {"kind": "image", "src": "assets/history/8f65395dba6d.png", "alt": "Imagen", "href": ""}, {"kind": "text", "html": "Como estudiantes y graduados argentinos de maestrías en el exterior, creemos que tenemos un fuerte rol para contribuir con el país, sobre todo en el desafiante contexto del COVID-19. Por ello creamos <strong>Masters Argentina Conecta</strong>, una nueva iniciativa de Masters Argentina, con la misma visión de encuentro, reflexión y debate para el desarrollo del país, en un ámbito de <strong>eventos online y con un fin solidario</strong>. Para lograrlo, decidimos aliarnos a la causa de <strong><a href=\"https://www.seamosuno.com.ar/\" rel=\"noopener noreferrer\" target=\"_blank\">#SeamosUno</a></strong>, ayudando a cubrir las necesidades de <strong>4 millones</strong> de personas argentinas afectadas por la pandemia, distribuyendo <strong>cajas de productos alimenticios y de higiene</strong>.<br/><br/>Durante junio y julio de 2020 realizamos una serie de 5 webinars con destacados oradores. Gracias al aporte de los asistentes y las empresas que nos auspiciaron, pudimos donar alimentos y productos de higiene a cientos de familias a través de <strong><a href=\"https://www.seamosuno.com.ar/\" rel=\"noopener noreferrer\" target=\"_blank\">#SeamosUno</a>.</strong>"}, {"kind": "embed", "src": "https://www.youtube.com/embed/1IQwqtzODdE?wmode=opaque"}], "source": "https://old.mastersargentina.org/master-argentina-conecta.html", "type": "story"}, {"title": "Primer webinar", "blocks": [{"kind": "image", "src": "assets/history/6ecc75338e3a.png", "alt": "Imagen", "href": ""}], "source": "https://old.mastersargentina.org/primer-webinar.html", "type": "story"}, {"title": "Segundo webinar", "blocks": [{"kind": "image", "src": "assets/history/5eb71367c6d2.png", "alt": "Imagen", "href": ""}, {"kind": "text", "html": "El segundo webinar \"Innovación y Tecnología: Emprendimientos con impacto\", trató en el comienzo sobre las exploraciones privadas al espacio exterior. Seguido a ello, debatimos sobre innovación y tecnología con impacto social, y la posición de la Argentina como potencial líder en la revolución del agtech y la biotecnología."}], "source": "https://old.mastersargentina.org/segundo-webinar.html", "type": "story"}, {"title": "Tercer webinar", "blocks": [{"kind": "image", "src": "assets/history/b4f8af633f2f.png", "alt": "Imagen", "href": ""}, {"kind": "text", "html": "En el tercer webinar: \"La reinvención del sector privado en tiempos de pandemia\", se discutió sobre el trabajo en tiempos de la pandemia, y cómo las empresas deben plantearse otro modelo de operaciones para el día después. Además, se habló sobre la reestructuración de costos y reinvención digital requeridos en este contexto, y el concepto de bienestar de los empleados frente a la ansiedad, incertidumbre y depresión actuales."}], "source": "https://old.mastersargentina.org/tercer-webinar.html", "type": "story"}, {"title": "Cuarto webinar", "blocks": [{"kind": "image", "src": "assets/history/f71645794c50.png", "alt": "Imagen", "href": ""}, {"kind": "text", "html": "El cuarto webinar: \"Argentina: Los desafíos del día después\", fue un encuentro íntimo con Facundo Manes, en donde se discutió acerca de los desafíos que tiene el país para poder recuperarse de los efectos que ha generado el COVID-19. La conversación abordó temas de salud que acechan a los argentinos desde una perspectiva neurocientífica, así como también sobre la necesidad de desarrollar un plan político, social y económico para cuando finalice la pandemia."}], "source": "https://old.mastersargentina.org/cuarto-webinar.html", "type": "story"}, {"title": "Quinto webinar", "blocks": [{"kind": "image", "src": "assets/history/720e786aef4a.png", "alt": "Imagen", "href": ""}, {"kind": "text", "html": "En el quinto webinar: \"Perspectivas sobre el presente y futuro de la Argentina\", tuvimos una charla con María Eugenia Vidal, Ex Gobernadora de la Provincia de Buenos Aires. Se habló acerca de los desafíos políticos, económicos y sociales que se avecinan en nuestro país, su aporte a la juventud argentina desde un nuevo rol post-gestión y también sobre el liderazgo femenino en tiempos de pandemia."}], "source": "https://old.mastersargentina.org/quinto-webinar.html", "type": "story"}]}, {"year": 2019, "city": "Washington DC", "date": "12 al 14 de abril de 2019", "title": "Capital humano para la Argentina del futuro", "venue": "Embajada Argentina", "summary": "Educación, innovación, ciencia, finanzas y energía: distintas miradas sobre el papel de las personas en el desarrollo del país.", "source": "https://old.mastersargentina.org/conferencia-2019.html", "cover": "assets/history/f4b18878ea23.jpg", "sections": [{"title": "Imágenes y videos de la edición", "blocks": [{"kind": "image", "src": "assets/history/f4b18878ea23.jpg", "alt": "Imagen del archivo oficial", "href": ""}], "type": "gallery"}, {"title": "Agenda", "blocks": [{"kind": "heading", "text": "CAPITAL HUMANO PARA LA ARGENTINA DEL FUTURO"}, {"kind": "heading", "te nología, competir contra los más grandes</strong><strong></strong>Sean <strong>SUMMERS, </strong>SVP Marketplace de MercadoLibre<em></em><em>Entrevista:</em> Tomás <strong>ALLENDE, </strong>Partner Beccar Varela<br/>"}, {"kind": "text", "html": "<br/><strong>PANEL 2: <br/>Multinacionales, ¿Cuáles son los desafíos para ser más eficientes?</strong>Martín <strong>BERARDI, </strong>CEO Ternium Argentina, Grupo TechintAlexia <strong>KEGLEVICH, </strong>CEO Assist-CardMiguel Ángel <strong>PEIRANO, </strong>CEO Coca-Cola AndinaLuis <strong>RAMÍREZ ROJAS, </strong>CEO Scania<em></em><em>Modera:</em> Francisco <strong>ORTEGA, </strong>Managing Partner de McKinsey &amp; Co.<br/>"}, {"kind": "text", "html": "<br/><strong>SPEAKER SERIES: </strong><br/><strong>Descifrando a Einstein, mirando el universo con nuevos ojos</strong><strong></strong>Gabriela <strong>GONZÁLEZ, </strong>Miembro Proyecto LIGO Ganador Premio Nobel Física"}, {"kind": "text", "html": "<br/><strong>PANEL 3: </strong><br/><strong>Infraestructura, Energía y Agro, herramientas para alcanzar nuestro potencial</strong>José Manuel <strong>AGGIO, </strong>VP Recursos Humanos YPF<br/>Pablo <strong>BERECIARTUA, </strong>Secretario de Infraestructura y Política Hídrica de la NaciónIgnacio <strong>LARTIRIGOYEN, </strong>Presidente Lartirigoyen &amp; Cía y Director de Bioceres S.A.<br/>Carlos <strong>ORMACHEA, </strong>CEO Tecpetrol, Grupo TechintMartín <strong>PASMAN,</strong> Presidente Valmont Industries de Argentina<em></em><em>Modera:</em> Federico <strong>EISNER, </strong>Director de Bain &amp; Company<br/>"}, {"kind": "text", "html": "<br/><strong>SPEAKER SERIES: </strong><br/><strong>Invertir en Argentina siendo extranjero, </strong><strong>¿</strong><strong>Odisea o desafío? El caso de la aerolínea low-cost</strong><br/>Julián <strong>COOK, </strong>CEO Flybondi"}, {"kind": "text", "html": "<br/><strong>SPEAKER SERIES: </strong><br/><strong>Científicos Argentinos, más allá de nuestro mundo</strong>Miguel <stron <section class="section about-purpose"><div class="split"><div><span class="eyebrow">Qué hacemos</span><h2>El encuentro es<br>el punto de partida.</h2></div><div class="about-activities-copy"><div class="about-main-activity"><span class="about-activity-label">Nuestro encuentro anual</span><h3>La conferencia Masters</h3><p>Dos días de paneles, preguntas y encuentros entre estudiantes argentinos y referentes de distintos sectores.</p><a class="text-link" href="#conferencia">Conocé la conferencia ↗</a></div><div class="about-other-activities"><h3>Más espacios para encontrarnos</h3><dl><div><dt>Orientación para posgrados</dt><dd>Charlas con consejos y experiencias para preparar tu postulación.</dd></div><div><dt>Encuentros en diferentes lugares del mundo</dt><dd><ul class="about-city-list"><li>París <strong>(Fecha a definir)</strong></li><li>Madrid <strong>(Fecha a definir)</strong></li></ul></dd></div><div><dt>Conexión con empleadores y referentes</dt><dd>Reunimos a estudiantes con empleadores y referentes de distintos sectores en charlas y encuentros. Son espacios para conocer qué buscan las organizaciones, compartir intereses profesionales y generar contactos directos.</dd></div></dl></div></div></div></section>
<section class="about-impact"><div class="section"><div class="section-header"><div><span class="eyebrow">El encuentro en números</span><h2>Una red que sigue creciendo.</h2></div><span class="about-edition-tag">Conferencia 2026 · Miami</span></div><div class="about-impact-grid">${[['270','personas reunidas','en la conferencia 2026'],['200+','estudiantes argentinos','de posgrado en el exterior'],['23','líderes invitados','de los sectores público y privado'],['11','ediciones','hasta el encuentro de 2026']].map(([n,t,d])=>`<div><strong>${n}</strong><h3>${t}</h3><p>${d}</p></div>`).join('')}</div><a class="text-link" href="${SOURCES['2026']}" target="_blank" rel="noopener noreferrer">Conocé la edición 2026 ↗</a></div></section>
<section class="section about-objectives"><div><span class="eyebrow">Qué queremos construir</span><h2>Argentina como<br>un compromiso.</h2><p>Conectamos estudiantes con líderes argentinos, formando la comunidad de estudiantes argentinos más grande de Estados Unidos y Europa.</p></div><figure class="about-objectives-photo"><img src="assets/about-grupo-linkedin.jpg" width="800" height="533" loading="lazy" alt="Foto grupal de los participantes de Masters Argentina 2025, con la bandera argentina en Columbia University"><figcaption>Masters 2025 · Columbia University <a href="https://www.linkedin.com/feed/update/urn:li:share:7315189195960958978/" target="_blank" rel="noopener noreferrer">Ver en LinkedIn ↗</a></figcaption></figure></section>

<section class="section about-team" id="about-team" tabindex="-1"><div class="section-header"><div><span class="eyebrow">Equipo 2026–2027</span><h2>Conocé a quienes<br>lo hacen posible.</h2></div><p>Seis áreas, un mismo compromiso.<br><small>Conocé al equipo de Masters.</small></p></div><div class="about-team-stack" data-about-team-panel>${ABOUT_TEAMS.map((_,i)=>aboutTeamPanel(i)).join('')}</div></section>
<section class="section about-alumni"><div class="split"><div><span class="eyebrow">Equipos anteriores</span><h2>Los que abrieron<br>el camino.</h2></div><div><p>Cada edición suma nuevas personas a la historia de Masters.</p><a class="text-link" href="#ediciones">Recorré las ediciones anteriores ↗</a></div></div></section>

 };

function initHistory(){
 cleanupHistoryTimeline();
 const page=document.querySelector('.history-page');
 if(!page)return;

 document.querySelectorAll('[data-history-year]').forEach(button=>button.addEventListener('click',()=>{const target=document.getElementById(`history-${button.dataset.historyYear}`);if(!target)return;target.setAttribute('tabindex','-1');target.focus({preventScroll:true});target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}));

function initHistoryTimeline(page){
 const bar=page.querySelector('.history-timeline-bar');
 const rail=bar.querySelector('.history-years');
 const header=document.querySelector('.site-header');
 const buttons=[...rail.querySelectorAll('[data-history-year]')];
 const sections=[...page.querySelectorAll('.history-edition')];
 let frame=0,activeYear='';
 const update=()=>{
  frame=0;
  if(!page.isConnected)return;
  const headerHeight=header.getBoundingClientRect().height;
  const barHeight=bar.getBoundingClientRect().height;
  page.style.setProperty('--history-header-height',headerHeight+'px');
  page.style.setProperty('--history-nav-height',barHeight+'px');
  page.style.setProperty('--history-scroll-padding',getComputedStyle(document.documentElement).scrollPaddingTop);
  const readingLine=headerHeight+barHeight+56;
  let current=sections[0];
  for(const section of sections){
   if(section.getBoundingClientRect().top<=readingLine)current=section;
   else break;
  }
  const year=current.id.replace('history-','');
  if(year===activeYear)return;
  activeYear=year;
  const activeIndex=buttons.findIndex(b=>b.dataset.historyYear===year);
  buttons.forEach((button,index)=>{
   if(index===activeIndex)button.setAttribute('aria-current','step');
   else button.removeAttribute('aria-current');
   button.closest('li').classList.toggle('is-passed',index<activeIndex);
  });
  const selected=buttons[activeIndex];
  const selectedRect=selected.getBoundingClientRect(),railRect=rail.getBoundingClientRect();
  if(selectedRect.left<railRect.left+8||selectedRect.right>railRect.right-8){
   rail.scrollTo({left:rail.scrollLeft+selectedRect.left-railRect.left-(rail.clientWidth-selectedRect.width)/2,behavior:'instant'});
  }
 };
 const schedule=()=>{if(!frame)frame=requestAnimationFrame(update);};
 const observer=new ResizeObserver(schedule);
 observer.observe(header);observer.observe(bar);observer.observe(page);
 window.addEventListener('scroll',schedule,{passive:true});
 window.addEventListener('resize',schedule,{passive:true});
 cleanupHistoryTimeline=()=>{
  window.removeEventListener('scroll',schedule);
  window.removeEventListener('resize',schedule);
  observer.disconnect();cancelAnimationFrame(frame);
 };
 update();
}

<section class="e26-speakers" id="e26-speakers"><div class="section conference-archive-carousels"><div class="section-header"><div><span class="eyebrow">Los protagonistas</span><h2>23 voces.<br>Muchas maneras de aportar.</h2></div><button type="button" class="conference-carousel-toggle" aria-pressed="false">Pausar carrusel</button></div><p>Experiencias del agro, la energía, el deporte, la educación, la gestión pública y el mundo emprendedor.</p>${archiveCircleRail('people','Todos los speakers de Miami 2026',EDITION_2026_SPEAKERS.map(p=>({...p,...SPEAKER_COMPANIES[p.name],image:p.image,role:p.role+' · '+p.company})))}<details class="e26-all-speakers"><summary>Ver los 23 speakers juntos</summary><div class="e26-speaker-grid">${EDITION_2026_SPEAKERS.map(p=>`<article><div class="e26-speaker-portrait"><img src="${p.image}" alt="${esc(p.name)}" width="150" height="150" loading="eager"></div><h3>${esc(p.name)}</h3><p>${esc(p.role)}<br>${esc(p.company)}</p></article>`).join('')}</div></details><p class="e26-source">Cargos e instituciones correspondientes a la edición 2026.</p></div></section>
<section class="section e26-program"><div><span class="eyebrow">El programa de 2026</span><h2>Los paneles</h2><p>Estos fueron los paneles y las charlas de los dos días: experiencias y miradas de distintos sectores para pensar el futuro del país.</p>${external(SOURCES['2026']+'agenda','Recorré el programa completo ↗')}</div><div>${[['viernes','Viernes 10 de abril'],['sabado','Sábado 11 de abril']].map(([day,label])=>`<div class="e26-day"><h3>${label}</h3><ul>${[...new Set(EDITION_2026_SPEAKERS.filter(p=>p.day===day).map(p=>p.panel))].map(panel=>`<li><span class="e26-panel-title">${esc(panel)}</span><span class="e26-panel-speakers">${EDITION_2026_SPEAKERS.filter(p=>p.day===day&&p.panel===panel).map(p=>esc(p.name)).join(' · ')}</span></li>`).join('')}</ul></div>`).join('')}</div></section>
<section class="e26-sponsors"><div class="section"><span class="eyebrow">Nos acompañaron en 2026</span><h2>Un encuentro que hicimos posible juntos.</h2><p>Sponsors Diamond de la edición Miami 2026.</p><div class="e26-sponsor-logos">${HOME_LOGOS.empresas.map(([image,name])=>`<img src="assets/${image}" alt="${name}" loading="lazy">`).join('')}</div>${external(SOURCES['2026'],'Conocé a todas las organizaciones que acompañaron ↗')}<p class="e26-source">Fotos, participantes y cifras: archivo oficial de Masters Argentina 2026.</p></div></section>
<section class="e26-next"><div class="section"><div><span class="eyebrow">La historia sigue</span><h2>El próximo encuentro<br>también puede ser el tuyo.</h2><p>Conocé lo que estamos preparando para Masters 2027.</p></div><a class="button" href="#conferencia">Conferencia 2027 ↗</a></div></section></div>`;
function initEdition2026(){document.querySelectorAll('.edition-2026 img').forEach(img=>{img.addEventListener('error',()=>{img.hidden=true;const fallback=document.createElement('span');fallback.className='e26-image-fallback';fallback.textContent=img.alt||'Foto de Miami 2026';img.after(fallback);},{once:true});});document.querySelectorAll('[data-e26-jump]').forEach(button=>button.addEventListener('click',()=>{document.getElementById(button.dataset.e26Jump)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}));}

const routes = {inicio:home,'quienes-somos':about,conferencia:conference,contacto:contact,ediciones:editions,};
const titles = {inicio:'Inicio','quienes-somos':'Quiénes somos',conferencia:'Conferencia 2027',contacto:'Contacto',ediciones:'Ediciones anteriores',apoyar:'Apoyar a Masters',faq:'Preguntas frecuentes'};
const nav = document.getElementById('main-nav');
const toggle = document.querySelector('.menu-toggle');
const editionsToggle = document.querySelector('.editions-toggle');
const editionsSubmenu = document.getElementById('editions-submenu');
function closeEditions(returnFocus=false){editionsSubmenu.hidden=true;editionsToggle.setAttribute('aria-expanded','false');if(returnFocus)editionsToggle.focus();}
editionsToggle.addEventListener('click',()=>{const open=editionsToggle.getAttribute('aria-expanded')!=='true';editionsToggle.setAttribute('aria-expanded',String(open));editionsSubmenu.hidden=!open;});
editionsToggle.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();editionsSubmenu.hidden=false;editionsToggle.setAttribute('aria-expanded','true');editionsSubmenu.querySelector('a').focus();}});
document.addEventListener('click',e=>{if(!e.target.closest('.editions-dropdown'))closeEditions();});
document.querySelector('.editions-dropdown').addEventListener('focusout',e=>{if(!e.currentTarget.contains(e.relatedTarget))closeEditions();});

function closeMenu(returnFocus=false){closeEditions();nav.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.querySelector('span').textContent='＋';if(returnFocus)toggle.focus();}
toggle.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';nav.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open));toggle.querySelector('span').textContent=open?'−':'＋';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!editionsSubmenu.hidden)closeEditions(true);else if(nav.classList.contains('open'))closeMenu(true);}});
nav.addEventListener('click',e=>{if(e.target.closest('a'))closeMenu();});
// En Inicio, el logo del encabezado aparece cuando el principal deja de verse.
function updateHeaderBrand(){
 const header=document.querySelector('.site-header');
 const brand=header?.querySelector('.brand');
 if(!brand)return;
 const heroLogo=document.querySelector('.home-cover #home-title img');
 let hide=false;
 if(heroLogo){
  const logoRect=heroLogo.getBoundingClientRect();
  const headerBottom=header.getBoundingClientRect().bottom;
  hide=logoRect.bottom>headerBottom && logoRect.top<window.innerHeight;
 }
 brand.classList.toggle('is-hidden-by-home-logo',hide);
 brand.inert=hide;
 if(hide)brand.setAttribute('aria-hidden','true');else brand.removeAttribute('aria-hidden');
}
let headerBrandFrame=0;
function scheduleHeaderBrandUpdate(){
 if(headerBrandFrame)return;
 headerBrandFrame=requestAnimationFrame(()=>{headerBrandFrame=0;updateHeaderBrand();});
}
window.addEventListener('scroll',scheduleHeaderBrandUpdate,{passive:true});
window.addEventListener('resize',scheduleHeaderBrandUpdate);
window.addEventListener('pageshow',scheduleHeaderBrandUpdate);
window.addEventListener('load',scheduleHeaderBrandUpdate);
function render(initial=false){
 cleanupManualCarousels();
 if(location.hash==='#contenido'){if(!initial){document.getElementById('contenido').focus();return;}history.replaceState(null,'','#inicio');}
 let [route,year]=location.hash.slice(1).split('/');route=route||'inicio';
 if(route==='alumni'||route==='faq'||route==='apoyar'){year=route==='faq'?'preguntas':route==='apoyar'?'sponsors':undefined;route='contacto';history.replaceState(null,'',`#contacto${year?'/'+year:''}`);}
 if(!routes[route]){route='inicio';history.replaceState(null,'','#inicio');}
 if(route==='ediciones'&&year!=='2026'){year='2025';if(location.hash!=='#ediciones')history.replaceState(null,'','#ediciones');}
 document.getElementById('contenido').innerHTML=portableHTML(routes[route](year), route !== 'ediciones' || year === '2026');
 document.title=`${route==='ediciones'&&year==='2026'?'Miami 2026 · Talento con impacto':titles[route]} · Masters Argentina · Versión mínima`;
 nav.querySelectorAll('a').forEach(a=>{if(a.hash===(route==='ediciones'&&year==='2026'?'#ediciones/2026':`#${route}`))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 editionsToggle.classList.toggle('is-current',route==='ediciones');
 closeMenu();
 const motion=document.querySelector('.home-motion-toggle');if(motion)motion.addEventListener('click',()=>{const paused=motion.getAttribute('aria-pressed')!=='true';motion.setAttribute('aria-pressed',String(paused));motion.textContent=paused?'Reanudar carruseles':'Pausar carruseles';document.querySelector('.home-partners').classList.toggle('is-paused',paused);});
 initArchiveCarousels();
 initAboutPage();
 initEdition2026();
 initContact();
 initHistory();
 initManualCarousels();
 if(!initial){window.scrollTo({top:0,behavior:'instant'});document.getElementById('contenido').focus({preventScroll:true});}
 updateHeaderBrand();
 if(route==='contacto'&&['sumarse','newsletter','sponsors','preguntas'].includes(year)){requestAnimationFrame(()=>document.getElementById(`contact-${year}`)?.scrollIntoView({behavior:'instant'}));}
}
window.addEventListener('hashchange',()=>render());
render(true);
